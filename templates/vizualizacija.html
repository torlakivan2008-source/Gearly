<!DOCTYPE html>
<html>
<head>
    <link rel="stylesheet"
          href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <title>Vizualizacija</title>
    <style>
        #chartContainer {
            width: 80%;
            max-width: 800px;
            margin: 0 auto;
        }
    </style>
</head>
<body>

<nav class="navbar navbar-expand-lg bg-body-tertiary" style="--bs-bg-opacity: 0.6;">
  <div class="container-fluid">
    <a class="navbar-brand" href="/">Gearly</a>
    <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNavAltMarkup" aria-controls="navbarNavAltMarkup" aria-expanded="false" aria-label="Toggle navigation">
      <span class="navbar-toggler-icon"></span>
    </button>
    <div class="collapse navbar-collapse" id="navbarNavAltMarkup">
      <div class="navbar-nav">
        <a class="nav-link" href="/add_gear">Dodaj Gear</a>
        <a class="nav-link" href="/view_gear">Popis Gear-a</a>
        <a class="nav-link" aria-current="page" href="/vizualizacija">Vizualizacija</a>
      </div>
    </div>
  </div>
</nav>

<h1 style="text-align: center;">Prosječan Power grupiran po Slotu</h1>
<br>
<div id="chartContainer">
    <canvas id="powerChart"></canvas>
</div>

<script>
const data = {{ data | tojson }};
const labels = Object.keys(data);
const values = Object.values(data);

const ctx = document.getElementById('powerChart').getContext('2d');
new Chart(ctx, {
    type: 'bar',
    data: {
        labels: labels,
        datasets: [{
            label: 'Power',
            data: values,
            backgroundColor: [
            'rgba(255, 99, 132, 0.2)',
            'rgba(255, 159, 64, 0.2)',
            'rgba(255, 205, 86, 0.2)',
            'rgba(75, 192, 192, 0.2)',
            'rgba(54, 162, 235, 0.2)'
            ],
            borderColor: [
            'rgb(255, 99, 132)',
            'rgb(255, 159, 64)',
            'rgb(255, 205, 86)',
            'rgb(75, 192, 192)',
            'rgb(54, 162, 235)'
            ],
            borderWidth: 1
        }]
    },
    options: {
        animation: false,
        responsive: true,
        maintainAspectRatio: true,
        scales: {
            y: {
                beginAtZero: true
            }
        }
    }
});
</script>

</body>
</html>
