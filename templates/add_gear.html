<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Dodaj Gear</title>
    <link rel="stylesheet"
          href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
    <style>
        [type=radio] {
          position: absolute;
          opacity: 0;
          width: 0;
          height: 0;
        }

        [type=radio]:checked + span{
          background-color: deepskyblue;
            color: white;
        }

        span {
            display: inline-block;
            padding-right: 20px;
            border-radius: 10px;
            border: 1px solid gray;
        }

        .slot {
            height: 60px;
        }

    </style>
</head>
<body class="bg-light">

<nav class="navbar navbar-expand-lg bg-body-tertiary" style="--bs-bg-opacity: 0.6;">
  <div class="container-fluid">
    <a class="navbar-brand" href="/">Gearly</a>
    <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNavAltMarkup" aria-controls="navbarNavAltMarkup" aria-expanded="false" aria-label="Toggle navigation">
      <span class="navbar-toggler-icon"></span>
    </button>
    <div class="collapse navbar-collapse" id="navbarNavAltMarkup">
      <div class="navbar-nav">
        <a class="nav-link" aria-current="page" href="/add_gear">Dodaj Gear</a>
        <a class="nav-link" href="/view_gear">Popis Gear-a</a>
        <a class="nav-link" href="/vizualizacija">Vizualizacija</a>
      </div>
    </div>
  </div>
</nav>


<div class="container mt-4" style="width: 800px">
    <h2>Dodaj Gear</h2>

    <form method="POST" action="/add_gear">

        <label class="form-label">Name</label>
        <input class="form-control" name="name" required>

        <label class="form-label mt-2">Gear Type</label>
        <input class="form-control" name="gear_type" value="N/A" optional>

        <label class="form-label mt-2">Slot</label>
        <fieldset required>
            <label><input type="radio" name="slot" value="Head" checked />
                <span><img class="slot" src="static/Head.png" alt=" ">Head</span>
            </label>
            <label><input type="radio" name="slot" value="Armor"/>
                <span><img class="slot" src="static/Armor.png" alt=" ">Armor</span>
            </label>
            <label><input type="radio" name="slot" value="Back"/>
                <span><img class="slot" src="static/Back.png" alt=" ">Back</span>
            </label>
            <label><input type="radio" name="slot" value="Weapon"/>
                <span><img class="slot" src="static/Weapon.png" alt=" ">Weapon</span>
            </label>
            <label><input type="radio" name="slot" value="Trinket"/>
                <span><img class="slot" src="static/Trinket.png" alt=" ">Trinket</span>
            </label>
        </fieldset>

        <label class="form-label mt-2">Power</label>
        <input class="form-control" type="number" name="power" required>

        <label for="stat" class="form-label mt-2">Stat</label>
        <select name="stat" id="stat" class="form-select" required>
        <option value="Armor">Armor</option>
        <option value="Damage">Damage</option>
        <option value="Mana">Mana</option>
        <option value="Health">Health</option>
        </select>

        <label class="form-label mt-2">Modifier</label>
        <input class="form-control" type="number" name="modifier" required>

        <button class="btn btn-success mt-3">Dodaj</button>
        <button class="btn btn-secondary mt-3" onclick="history.back()">Natrag</button>
    </form>
</div>

</body>
</html>
