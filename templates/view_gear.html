<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Popis Gear-a</title>
    <link rel="stylesheet"
          href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
    <style>
        [type=radio] {
          position: absolute;
          opacity: 0;
          width: 0;
          height: 0;
        }
        
        [type=radio]:checked + span{
          background-color: deepskyblue;
            color: white;
        }

        span {
            display: inline-block;
            padding-right: 20px;
            border-radius: 10px;
            border: 1px solid gray;
        }

        table {
            text-align: center;
            margin: 20px;
        }
        tr {
            border-bottom: 1px solid lightgray;
        }
        th,td {
            padding-left: 10px;
            padding-right: 10px;
        }
        td:nth-child(even), th:nth-child(even) {
            border-right: 1px solid lightgray;
            border-left: 1px solid lightgray;
        }

        .slot {
            height: 60px;
        }
    </style>

</head>
<body class="bg-light">

<nav class="navbar navbar-expand-lg bg-body-tertiary" style="--bs-bg-opacity: 0.6;">
  <div class="container-fluid">
    <a class="navbar-brand" href="/">Gearly</a>
    <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNavAltMarkup" aria-controls="navbarNavAltMarkup" aria-expanded="false" aria-label="Toggle navigation">
      <span class="navbar-toggler-icon"></span>
    </button>
    <div class="collapse navbar-collapse" id="navbarNavAltMarkup">
      <div class="navbar-nav">
        <a class="nav-link" href="/add_gear">Dodaj Gear</a>
        <a class="nav-link" aria-current="page" href="/view_gear">Popis Gear-a</a>
        <a class="nav-link" href="/vizualizacija">Vizualizacija</a>
      </div>
    </div>
  </div>
</nav>

<div class="container mt-4" style="margin-bottom: 200px">
    <div class="row">
        <div class="col-md-3">
            <h4>Filters</h4>
            <div class="mb-3">
                <label class="form-label">Slot</label>
                <select id="filterSlot" class="form-select">
                    <option value="All">All</option>
                    <option value="Head">Head</option>
                    <option value="Armor">Armor</option>
                    <option value="Back">Back</option>
                    <option value="Weapon">Weapon</option>
                    <option value="Trinket">Trinket</option>
                </select>
            </div>
            <div class="mb-3">
                <label class="form-label">Sort By</label>
                <select id="sortBy" class="form-select">
                    <option value="none">None</option>
                    <option value="power-desc">Power: High → Low</option>
                    <option value="power-asc">Power: Low → High</option>
                    <option value="name-asc">Name: A → Z</option>
                    <option value="name-desc">Name: Z → A</option>
                </select>
            </div>
            <div>
                <button id="resetFilters" class="btn btn-secondary btn-sm">Reset</button>
            </div>
            <br>
        </div>
        <div class="col-md-9">
            <h2>Popis Gear-a</h2>

            <ul class="list-group" id="gearList">
        {% for gear in data %}
        <li class="list-group-item" data-slot="{{ gear.slot }}" data-geartype="{{ gear.gear_type }}" data-power="{{ gear.power }}" data-name="{{ gear.name }}">

            <div class="d-flex justify-content-between align-items-left" style="flex-direction: column">
                <strong style="font-size: 30px">{{ gear.name }}</strong><br>
                <hr>
                <div class="d-flex justify-content-between align-items-center">
                    <small>
                        <table>
                          <tr>
                              <th>Gear type</th>
                              <th>Slot</th>
                              <th>Power</th>
                              <th>Stat</th>
                              <th>Modifier</th>
                          </tr>
                          <tr>
                              <td> {% if gear.gear_type == '' %}N/A{% endif %}{{ gear.gear_type }} </td>
                              <td> <img src="static/{{ gear.slot }}.png" alt="" class="slot"> </td>
                              <td> {{ gear.power }} </td>
                              <td> {{ gear.stat }} </td>
                              <td> {{ gear.modifier }} </td>
                          </tr>
                        </table>
                    </small>
                    <div class="d-flex gap-2" style="padding: 20px">
                        <div>
                            <button class="btn btn-primary btn-sm"
                                    type="button"
                                    onclick="izmjeniGear({{ gear.id }})">Uredi</button>
                        </div>
                        <div>
                            <button class="btn btn-danger btn-sm"
                                    type="button"
                                    onclick="obrisiGear({{ gear.id }})">Obriši</button>
                        </div>
                    </div>
                </div>
            </div>


            <form class="mt-3 d-none" id="edit-{{ gear.id }}">
                <input type="hidden" name="id" value="{{ gear.id }}">

                <label class="form-label">Naziv</label>
                <input class="form-control" name="name" value="{{ gear.name }}" required>

                <label class="form-label mt-2">Tip</label>
                <input class="form-control" name="gear_type" value="{% if gear.gear_type == '' %}N/A{% endif %}{{ gear.gear_type }}" optional>

                <label class="form-label mt-2">Slot</label>
                <fieldset required>
                    <label><input type="radio" name="slot" value="Head" {% if gear.slot == 'Head' %}checked{% endif %} />
                        <span><img class="slot" src="static/Head.png" alt=" ">Head</span>
                    </label>
                    <label><input type="radio" name="slot" value="Armor" {% if gear.slot == 'Armor' %}checked{% endif %} />
                        <span><img class="slot" src="static/Armor.png" alt=" ">Armor</span>
                    </label>
                    <label><input type="radio" name="slot" value="Back" {% if gear.slot == 'Back' %}checked{% endif %} />
                        <span><img class="slot" src="static/Back.png" alt=" ">Back</span>
                    </label>
                    <label><input type="radio" name="slot" value="Weapon" {% if gear.slot == 'Weapon' %}checked{% endif %} />
                        <span><img class="slot" src="static/Weapon.png" alt=" ">Weapon</span>
                    </label>
                    <label><input type="radio" name="slot" value="Trinket" {% if gear.slot == 'Trinket' %}checked{% endif %} />
                        <span><img class="slot" src="static/Trinket.png" alt=" ">Trinket</span>
                    </label>
                </fieldset>

                <label class="form-label mt-2">Power</label>
                <input class="form-control" type="number" name="power" value="{{ gear.power }}" required>

                <label for="stat-{{ gear.id }}" class="form-label mt-2">Stat</label>
                <select name="stat" id="stat-{{ gear.id }}" class="form-select" required>
                    <option value="Armor" {% if gear.stat == 'armor' %}selected{% endif %}>Armor</option>
                    <option value="Damage" {% if gear.stat == 'damage' %}selected{% endif %}>Damage</option>
                    <option value="Mana" {% if gear.stat == 'mana' %}selected{% endif %}>Mana</option>
                    <option value="Health" {% if gear.stat == 'health' %}selected{% endif %}>Health</option>
                </select>

                <label class="form-label mt-2">Modifier</label>
                <input class="form-control" type="number" name="modifier" value="{{ gear.modifier }}" required>

                <button class="btn btn-success mt-3">Spremi</button>
            </form>

        </li>
        {% endfor %}
            </ul>
        </div>
    </div>
</div>

<script>
function izmjeniGear(id) {
    const form = document.getElementById("edit-" + id);
    form.classList.toggle("d-none");
}

function obrisiGear(id) {
    if (!confirm("Obrisati ovaj gear?")) return;

    fetch("/gear/" + id, { method: "DELETE" })
        .then(() => location.reload());
}

async function submitEditForm(event) {
    event.preventDefault();
    const form = event.target;
    const gearId = form.querySelector('input[name="id"]').value;

    const data = {
        name: form.querySelector('input[name="name"]').value,
        gear_type: form.querySelector('input[name="gear_type"]').value,
        slot: form.querySelector('input[name="slot"]:checked').value,
        power: form.querySelector('input[name="power"]').value,
        stat: form.querySelector('select[name="stat"]').value,
        modifier: form.querySelector('input[name="modifier"]').value
    };

    try {
        const response = await fetch(`/gear/${gearId}`, {
            method: 'PATCH',
            headers: {
                'Content-Type': 'application/json'
            },
            body: JSON.stringify(data)
        });

        if (response.ok) {
            alert('Gear updated successfully');
            location.reload();
        } else {
            const error = await response.json();
            alert('Error: ' + (error.error || 'Failed to update'));
        }
    } catch (error) {
        alert('Error: ' + error.message);
    }
}

let originalItems = [];

function applyFilters() {
    const slot = document.getElementById('filterSlot').value;
    const sortBy = document.getElementById('sortBy').value;

    let filtered = originalItems.filter(li => {
        return (slot === 'All') || (li.dataset.slot === slot);
    });

    if (sortBy !== 'none') {
        filtered.sort((a, b) => {
            if (sortBy.startsWith('power')) {
                const av = Number(a.dataset.power) || 0;
                const bv = Number(b.dataset.power) || 0;
                return sortBy === 'power-desc' ? bv - av : av - bv;
            }
            if (sortBy.startsWith('name')) {
                const an = (a.dataset.name || '').toLowerCase();
                const bn = (b.dataset.name || '').toLowerCase();
                if (an < bn) return sortBy === 'name-asc' ? -1 : 1;
                if (an > bn) return sortBy === 'name-asc' ? 1 : -1;
                return 0;
            }
            return 0;
        });
    }

    const ul = document.getElementById('gearList');
    ul.innerHTML = '';
    filtered.forEach(li => ul.appendChild(li));
}

function resetFilters() {
    document.getElementById('filterSlot').value = 'All';
    document.getElementById('sortBy').value = 'none';
    applyFilters();
}

document.getElementById('filterSlot').addEventListener('change', applyFilters);
document.getElementById('sortBy').addEventListener('change', applyFilters);
document.getElementById('resetFilters').addEventListener('click', resetFilters);

document.addEventListener('DOMContentLoaded', () => {
    originalItems = Array.from(document.querySelectorAll('#gearList .list-group-item'));
    applyFilters();

    document.querySelectorAll('form[id^="edit-"]').forEach(form => {
        form.addEventListener('submit', submitEditForm);
    });
});

</script>

</body>
</html>
